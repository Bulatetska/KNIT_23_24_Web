<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Feedback</title>

<style>
body{
    font-family: Arial;
    width: 600px;
    margin: auto;
    padding: 50px;
}

form{
    background:#f2f2f2;
    padding:20px;
    border-radius:25px;
}

input, textarea{
    width:90%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
}

.rating-input{
    background:#fff3cd;
    border:2px solid orange;
}

button{
    padding:10px 20px;
    background:green;
    color:white;
    border:none;
}

.error{
    color:red;
}

.success{
    color:green;
}
</style>

</head>
<body>

<h1>Feedback Form</h1>

<form method="POST">
    {% csrf_token %}

    {% for field in form %}
        <label>{{ field.label }}</label>
        {{ field }}
    {% endfor %}

    <button type="submit">Send</button>
</form>

{% if message %}
<p class="success">{{ message }}</p>
{% endif %}

{% if errors %}
<div class="error">
    <h3>Помилки:</h3>
    <ul>
    {% for error in errors %}
        <li>{{ error }}</li>
    {% endfor %}
    </ul>
</div>
{% endif %}

</body>
</html>
