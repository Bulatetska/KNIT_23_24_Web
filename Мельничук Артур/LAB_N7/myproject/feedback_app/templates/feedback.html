<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Відгук</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
        }
        input, textarea {
            display: block;
            margin-bottom: 15px;
            padding: 8px;
            width: 100%;
        }
        .rating-input {
            width: 60px;
            font-size: 18px;
        }
        .error {
            color: red;
        }
        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Залишити відгук</h1>

    {% if message %}
        <p><strong>{{ message }}</strong></p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
            <div>
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <p class="error">{{ field.errors }}</p>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit">Відправити</button>
    </form>
</body>
</html>
