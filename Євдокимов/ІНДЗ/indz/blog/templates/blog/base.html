<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Блог{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }
        .navbar { background: #2c3e50; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: white; text-decoration: none; font-size: 18px; font-weight: bold; }
        .navbar .nav-links a { margin-left: 20px; font-size: 14px; color: #bdc3c7; }
        .navbar .nav-links a:hover { color: white; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .btn { padding: 10px 20px; background: #2c3e50; color: white; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; font-size: 14px; }
        .btn:hover { background: #34495e; }
        .btn-green { background: #27ae60; }
        .btn-green:hover { background: #2ecc71; }
        .form-input, .form-textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        .form-textarea { resize: vertical; }
        .alert { padding: 10px 15px; background: #e8f5e9; border-left: 4px solid #27ae60; margin: 10px 0; border-radius: 3px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/">📝 Мій Блог</a>
        <div class="nav-links">
            <a href="/">Головна</a>
            <a href="/new/">+ Новий пост</a>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
