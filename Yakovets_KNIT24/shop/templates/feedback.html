<!DOCTYPE html>
<html>
<head>
    <title>Зворотний зв'язок</title>
    <style>
        .form-field { margin-bottom: 15px; }
        .rating-input { border: 2px solid #007bff; border-radius: 5px; width: 50px; }
        .errorlist { color: red; list-style: none; padding: 0; }
        label { font-weight: bold; display: block; }
    </style>
</head>
<body>
    <h2>Залиште свій відгук</h2>

    {% if success %}
        <p style="color: green;">Дякуємо! Ваш відгук збережено.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        
        {% for field in form %}
            <div class="form-field">
                {{ field.label_tag }}
                {{ field }}
                
                {% if field.errors %}
                    <ul class="errorlist">
                        {% for error in field.errors %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit">Надіслати</button>
    </form>
</body>
</html>
